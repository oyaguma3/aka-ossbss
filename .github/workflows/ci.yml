# テスト（PostgreSQL の結合テストを含む）、イメージのビルド（画面の CSS の生成を含む）と compose の設定の確認、
# aka-provisioner との契約テストを行う。
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# 同じブランチで新しく push したら、古い実行は止める。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: テスト
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # internal/db の結合テストに使う（テストのたびに public スキーマを作り直す）。
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: ossbss_test
          POSTGRES_USER: ossbss
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ossbss -d ossbss_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      OSSBSS_TEST_DB_ADDR: localhost:5432
      OSSBSS_TEST_DB_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: 整形の確認
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt で整形されていないファイル:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: テスト（PostgreSQL の結合テストを含む）
        run: go test -race -count=1 ./...
      - name: PostgreSQL の結合テストが実行されたことの確認
        run: |
          set -o pipefail
          # 接続先がなければ結合テストはスキップされ、テスト自体は成功してしまうので、別に確かめる。
          go test -count=1 -v ./internal/db/ | tee db.log
          if grep -q -- '--- SKIP' db.log; then
            echo "PostgreSQL の結合テストがスキップされました"
            exit 1
          fi

  docker:
    name: イメージと compose の設定
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: イメージのビルド（画面の CSS の生成を含む）
        run: docker build --build-arg VERSION="${GITHUB_SHA::7}" -t aka-ossbss:ci .
      - name: 生成した CSS の確認
        run: |
          # Tailwind CSS と daisyUI で作った CSS が入っていること（テンプレートのクラスと、ダークテーマ）。
          docker create --name css aka-ossbss:ci >/dev/null
          docker cp css:/aka-ossbss ./aka-ossbss-bin
          docker rm css >/dev/null
          strings ./aka-ossbss-bin | grep -q 'daisyUI' || { echo "daisyUI の CSS が埋め込まれていません"; exit 1; }
          strings ./aka-ossbss-bin | grep -q 'prefers-color-scheme:dark' || { echo "ダークテーマの CSS がありません"; exit 1; }
      - name: compose の設定
        run: |
          cp .env.example .env
          sed -i -e 's|^OSSBSS_DB_PASSWORD=.*|OSSBSS_DB_PASSWORD=ci|' \
            -e 's|^OSSBSS_ACCESS_TEAM_DOMAIN=.*|OSSBSS_ACCESS_TEAM_DOMAIN=ci.cloudflareaccess.com|' \
            -e 's|^OSSBSS_ACCESS_AUD=.*|OSSBSS_ACCESS_AUD=ci-aud|' \
            -e 's|^OSSBSS_INITIAL_ADMIN_EMAIL=.*|OSSBSS_INITIAL_ADMIN_EMAIL=admin@example.com|' .env
          docker compose config -q
          docker compose config --services
          # aka-ossbss・PostgreSQL・cloudflared の 3 つ。
          docker compose config --format json > config.json
          jq -e '.services | keys == ["aka-ossbss", "cloudflared", "postgres"]' config.json
          # ホストにポートを公開しない（要求は cloudflared から届く）。開発用の設定は compose には書かない。
          jq -e '[.services[].ports // [] | .[]] | length == 0' config.json
          ! grep -q 'OSSBSS_DEV_USER_EMAIL' config.json
          # Tunnel のトークンは環境変数でなくファイルで渡す。
          jq -e '.services.cloudflared.command | index("--token-file") != null' config.json
          jq -e '.services.cloudflared.volumes[] | select(.target == "/etc/cloudflared/token")
            | .type == "bind" and .read_only == true and (.source | endswith("/secrets/tunnel-token"))' config.json
          # ファイルがなければ起動しない（create_host_path: false）。config の出力は compose の版によって既定の値を省くので
          # （省く値が true の版と false の版がある）、compose.yaml そのものを確かめる。
          grep -q 'create_host_path: false' compose.yaml
          ! grep -qi 'TUNNEL_TOKEN' config.json
          # 一括投入の KEK は secrets で渡す（環境変数に値を書かない）。
          jq -e '.services["aka-ossbss"].secrets[] | select(.source == "kek") | .target | endswith("kek")' config.json
          jq -e '.secrets.kek.file | endswith("/secrets/kek")' config.json
          jq -e '.services["aka-ossbss"].environment.OSSBSS_KEK_FILE == "/run/secrets/kek"' config.json
          # 突き合わせの設定（時刻と安全弁の上限）。
          jq -e '.services["aka-ossbss"].environment.OSSBSS_RECONCILE_AT == "04:00"' config.json
          jq -e '.services["aka-ossbss"].environment.OSSBSS_RECONCILE_MAX_FIXES == "1000"' config.json
          # 監査ログのファイルのディレクトリをマウントする。
          jq -e '.services["aka-ossbss"].volumes[] | select(.target == "/data/audit") | .source | endswith("/audit")' config.json
          jq -e '.services["aka-ossbss"].environment.OSSBSS_PROVISIONER_URL | endswith("/admin/v2")' config.json
          # 管理面の Fluent Bit に送る重ね合わせ（3 つのサービスにタグを付ける）。
          docker compose -f compose.yaml -f compose.fluent-bit.yaml config --format json > fluent.json
          jq -e '[.services[] | .logging.driver] == ["fluentd", "fluentd", "fluentd"]' fluent.json
          jq -e '[.services | to_entries[] | .value.logging.options.tag] | sort == ["app.ossbss", "app.ossbss-cloudflared", "app.ossbss-postgres"]' fluent.json
          # 必須の設定が空なら、compose が断る。
          sed -i -e 's|^OSSBSS_ACCESS_AUD=.*|OSSBSS_ACCESS_AUD=|' .env
          ! docker compose config -q 2>/dev/null

  provisioner:
    name: aka-provisioner との契約テスト
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 契約テストの相手にする aka-provisioner と、その下流（aka-vecgen・aka-radius）のコミット。
      # 下流は aka-provisioner の ci.yml の VECGEN_REF・RADIUS_REF（aka-mvpset の versions.env）に合わせる。
      # aka-provisioner や下流の API を変えたら、その main のコミットに更新する。
      PROVISIONER_REF: ff21ac4f711112b175bceeb8c190bf0f2ebb4389
      VECGEN_REF: 2d4837939660fbadcec67b27b4ac333f96a77374
      RADIUS_REF: ac2f05aeda99472284f48b09943c1553476a6a7b
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: oyaguma3/aka-provisioner
          ref: ${{ env.PROVISIONER_REF }}
          path: aka-provisioner
      - uses: actions/checkout@v7
        with:
          repository: oyaguma3/aka-vecgen
          ref: ${{ env.VECGEN_REF }}
          path: aka-vecgen
      - uses: actions/checkout@v7
        with:
          repository: oyaguma3/aka-radius
          ref: ${{ env.RADIUS_REF }}
          path: aka-radius
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: aka-provisioner・下流・aka-ossbss のビルド
        run: |
          git -C aka-provisioner log -1 --format='aka-provisioner: %h %s'
          git -C aka-vecgen log -1 --format='aka-vecgen: %h %s'
          git -C aka-radius log -1 --format='aka-radius: %h %s'
          mkdir -p "$RUNNER_TEMP/bin"
          (cd aka-provisioner && go build -o "$RUNNER_TEMP/bin/aka-provisioner" ./cmd/aka-provisioner)
          (cd aka-vecgen && go build -o "$RUNNER_TEMP/bin/aka-vecgen" ./cmd/aka-vecgen)
          (cd aka-radius && go build -o "$RUNNER_TEMP/bin/aka-radius" ./cmd/aka-radius)
          go build -o "$RUNNER_TEMP/aka-ossbss" ./cmd/aka-ossbss
      - name: 下流と aka-provisioner の起動
        # aka-provisioner の scripts/contract.sh が、Valkey 3 つ（Docker）と aka-vecgen・aka-radius の admin・aka-provisioner を
        # ループバックで起動し、管理クライアント（ossbss-ci）の証明書と試験の環境変数（contract.env）を作る。
        run: aka-provisioner/scripts/contract.sh up "$RUNNER_TEMP/bin" "$RUNNER_TEMP/work"
      - name: aka-provisioner に接続できることの確認
        env:
          # check-provisioner は設定をすべて読むので、DB と利用者の識別の設定も与える（DB には接続しない）。
          OSSBSS_ADDR: 127.0.0.1:18446
          OSSBSS_DB_PASSWORD: unused
          OSSBSS_INITIAL_ADMIN_EMAIL: admin@example.com
          OSSBSS_DEV_USER_EMAIL: admin@example.com
        run: |
          . "$RUNNER_TEMP/work/contract.env"
          OSSBSS_PROVISIONER_URL="$PROVISIONER_TEST_URL" OSSBSS_PROVISIONER_CLIENT_CERT="$PROVISIONER_TEST_CLIENT_CERT" \
          OSSBSS_PROVISIONER_SERVER_CERT="$PROVISIONER_TEST_SERVER_CERT" "$RUNNER_TEMP/aka-ossbss" check-provisioner
      - name: 契約テスト
        run: |
          set -o pipefail
          . "$RUNNER_TEMP/work/contract.env"
          export OSSBSS_TEST_PROVISIONER_URL="$PROVISIONER_TEST_URL" OSSBSS_TEST_PROVISIONER_CLIENT_CERT="$PROVISIONER_TEST_CLIENT_CERT" \
            OSSBSS_TEST_PROVISIONER_SERVER_CERT="$PROVISIONER_TEST_SERVER_CERT" OSSBSS_TEST_PROVISIONER_AV_CLIENT_ID="$PROVISIONER_TEST_AV_CLIENT_ID" \
            OSSBSS_TEST_PROVISIONER_SOURCE_ID="$PROVISIONER_TEST_SOURCE_ID"
          go test -count=1 -race -run Integration -v ./internal/provisioner/ | tee contract.log
          # 接続先の指定が漏れると契約テストはスキップされ、テスト自体は成功してしまうので、別に確かめる。
          if grep -q -- '--- SKIP' contract.log; then
            echo "契約テストがスキップされました"
            exit 1
          fi
      - name: ログ（失敗時）
        if: failure()
        run: |
          for f in aka-vecgen aka-radius aka-provisioner; do
            echo "---- $f ----"; cat "$RUNNER_TEMP/work/$f.log" || true
          done
      - name: 片付け
        if: always()
        run: aka-provisioner/scripts/contract.sh down "$RUNNER_TEMP/work" || true
