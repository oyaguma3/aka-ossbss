# aka-provisioner（以下「provisioner」）と同じホストで動かすときに重ねる設定。
# provisioner の compose が作る共有ネットワーク（既定の名前は aka-provisioner）に aka-ossbss だけを参加させ、
# ホスト名 aka-provisioner で provisioner に接続する（OSSBSS_PROVISIONER_URL の既定）。PostgreSQL は参加させない。
# provisioner を先に起動する。.env の COMPOSE_FILE=compose.yaml:compose.aka-provisioner.yaml で有効になる。
# 別のホストの provisioner につなぐときは重ねず、OSSBSS_PROVISIONER_URL を VPN 側のアドレスにする。
services:
  aka-ossbss:
    networks:
      - default
      - aka-provisioner

networks:
  aka-provisioner:
    external: true
    name: ${PROVISIONER_SHARED_NETWORK:-aka-provisioner}
