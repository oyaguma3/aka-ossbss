{{define "content" -}}
{{$logout := .LogoutURL -}}
{{$user := .User -}}
{{with .Data -}}
<div class="card bg-base-100 shadow max-w-xl mx-auto">
  <div class="card-body">
    <h1 class="card-title">{{.Status}}</h1>
    <p role="alert">{{.Message}}</p>
    <div class="card-actions justify-end">
      {{- if and .Relogin $logout}}
      <a href="{{$logout}}" class="btn">別のメールアドレスでログインし直す</a>
      {{- end}}
      {{- /* 利用者を確かめられなかった画面（401・登録のない 403・503）では、トップへ戻っても同じ画面になるので出さない。 */}}
      {{- if $user}}
      <a href="/" class="btn btn-primary">トップへ</a>
      {{- end}}
    </div>
  </div>
</div>
{{- end}}
{{- end}}
