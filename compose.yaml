services:
  eapaka-ossbss:
    build:
      context: .
      args:
        VERSION: ${OSSBSS_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      OSSBSS_ADDR: ":8446"
      OSSBSS_DB_ADDR: postgres:5432
      OSSBSS_DB_NAME: ossbss
      OSSBSS_DB_USER: ossbss
      OSSBSS_DB_PASSWORD: ${OSSBSS_DB_PASSWORD:?.env に OSSBSS_DB_PASSWORD を設定してください}
      OSSBSS_LOG_LEVEL: ${OSSBSS_LOG_LEVEL:-info}
      # 利用者は Cloudflare Access の JWT で識別する（設計概要 §5）。compose では開発用の設定（OSSBSS_DEV_USER_EMAIL）は
      # 使えない（ループバックで待ち受けるときだけ。§17.2）。
      OSSBSS_ACCESS_TEAM_DOMAIN: ${OSSBSS_ACCESS_TEAM_DOMAIN:?.env に OSSBSS_ACCESS_TEAM_DOMAIN を設定してください}
      OSSBSS_ACCESS_AUD: ${OSSBSS_ACCESS_AUD:?.env に OSSBSS_ACCESS_AUD を設定してください}
      OSSBSS_INITIAL_ADMIN_EMAIL: ${OSSBSS_INITIAL_ADMIN_EMAIL:?.env に OSSBSS_INITIAL_ADMIN_EMAIL を設定してください}
      # eapaka-node-provisioner への接続（設計概要 §10）。URL を空にすると同一ホストの共有ネットワークの名前を使う。
      OSSBSS_PROVISIONER_URL: ${OSSBSS_PROVISIONER_URL:-https://eapaka-provisioner:9446/admin/v1}
      OSSBSS_PROVISIONER_CLIENT_CERT: /certs/provisioner-client.pem
      OSSBSS_PROVISIONER_CLIENT_KEY: ${OSSBSS_PROVISIONER_CLIENT_KEY:-}
      OSSBSS_PROVISIONER_SERVER_CERT: /certs/provisioner-server.pem
      OSSBSS_PROVISIONER_TIMEOUT: ${OSSBSS_PROVISIONER_TIMEOUT:-60s}
    volumes:
      # provisioner 用の証明書（provisioner-client.pem: gen-client-cert で作った本BFF のクライアント証明書と秘密鍵、
      # provisioner-server.pem: provisioner の server-cert で取り出したサーバー証明書）。
      # コンテナは UID 65532 で動くので、ファイルはこの UID で読めるようにする。
      - ./certs:/certs:ro
    # ホストにポートを公開しない。ブラウザからの要求は、同じ compose の cloudflared から届く（設計概要 §5.4、§12）。
    # 接続元のアドレスは、cloudflared が付ける Cf-Connecting-IP を使う（§17.2 の 4）。
    healthcheck:
      test: ["CMD", "/eapaka-ossbss", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - default

  cloudflared:
    # Cloudflare Tunnel のコネクター（設計概要 §5.4、§12）。外向きに Cloudflare へ接続し、公開ホスト名への要求を
    # 本BFF（http://eapaka-ossbss:8446。Tunnel の公開ホスト名の向け先に書く）に届ける。ホストの受信のポートは開けない。
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    depends_on:
      eapaka-ossbss:
        condition: service_healthy
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/etc/cloudflared/token"]
    volumes:
      # Tunnel のトークン（秘密の値）はファイルで渡す（.env に書くと docker compose config の出力やコンテナの環境変数に出るため）。
      # コンテナは UID 65532 で動くので、ファイルはこの UID で読めるようにする（chmod 600。運用ガイド 2.6）。
      # ファイルがなければ起動しない（ディレクトリを作らせない）。
      - type: bind
        source: ./secrets/tunnel-token
        target: /etc/cloudflared/token
        read_only: true
        bind:
          create_host_path: false
    # ヘルスチェックは付けない（イメージにシェルや curl がない）。状態は docker compose logs cloudflared と
    # Cloudflare のダッシュボードの Tunnel の状態で確かめる（運用ガイド 10 章）。
    networks:
      - default

  postgres:
    image: postgres:18.6
    restart: unless-stopped
    # 本BFF 専用（テナント・利用者・所属・監査ログ。設計概要 §11）。ポートは公開しない。
    environment:
      POSTGRES_DB: ossbss
      POSTGRES_USER: ossbss
      POSTGRES_PASSWORD: ${OSSBSS_DB_PASSWORD:?.env に OSSBSS_DB_PASSWORD を設定してください}
    volumes:
      # PostgreSQL 18 のイメージは、データを /var/lib/postgresql/18/docker に置く（版ごとのディレクトリ）。
      - postgres-data:/var/lib/postgresql
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ossbss -d ossbss"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
